<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Point - Dart Game Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #1d2129;
      --soft: #252a34;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f7fb;
      --muted: #a8b0c0;
      --accent: #ff5a36;
      --accent-2: #ffd166;
      --success: #67e8a5;
      --danger: #ff6b6b;
      --blue: #7cc6ff;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 22px;
      --radius-sm: 14px;
      --max: 1400px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: var(--max);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      padding: 20px 32px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .controls-top {
      display: flex;
      gap: 12px;
    }

    button {
      font-family: inherit;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      background: var(--soft);
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-accent {
      background: var(--accent);
      color: #000;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    /* Target Display */
    .target-card {
      background: linear-gradient(135deg, var(--panel-2), var(--soft));
      text-align: center;
      padding: 28px;
      margin-bottom: 24px;
      border: 2px solid var(--accent);
    }

    .target-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .target-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      color: var(--accent-2);
      line-height: 1;
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .player-card {
      background: var(--panel-2);
      padding: 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    .player-card.active {
      border-color: var(--accent);
      background: rgba(255, 90, 54, 0.05);
    }

    .player-name {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .player-score {
      font-size: 2.2rem;
      font-weight: 700;
    }

    /* Modifier Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-mod {
      padding: 24px 12px;
      font-size: 1.1rem;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .btn-mod.single { border-color: var(--blue); color: var(--blue); }
    .btn-mod.double { border-color: var(--accent-2); color: var(--accent-2); }
    .btn-mod.triple { border-color: var(--accent); color: var(--accent); }
    .btn-mod.bull { grid-column: span 1; background: var(--soft); }
    .btn-mod.miss { grid-column: span 1; color: var(--danger); }

    /* History Feed */
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--panel-2);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>FLASH POINT</h1>
      <div class="controls-top">
        <button onclick="startNewGame()" class="btn-accent">New Game</button>
      </div>
    </header>

    <div class="main-grid">
      <!-- Left Column: Target & Input Controls -->
      <div class="card">
        <!-- Dynamic Target Display -->
        <div class="target-card card">
          <div class="target-title">Current Round Target</div>
          <div class="target-number" id="target-display">--</div>
        </div>

        <!-- Modifier Controls -->
        <div class="keypad">
          <button class="btn-mod single" onclick="handleInput(1)">SINGLE (1x)</button>
          <button class="btn-mod double" onclick="handleInput(2)">DOUBLE (2x)</button>
          <button class="btn-mod triple" onclick="handleInput(3)">TRIPLE (3x)</button>
          <button class="btn-mod bull" onclick="handleBull(25)">OUTER BULL (25)</button>
          <button class="btn-mod bull" onclick="handleBull(50)">INNER BULL (50)</button>
          <button class="btn-mod miss" onclick="handleInput(0)">MISS (0)</button>
        </div>
      </div>

      <!-- Right Column: Scores & Log -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        <div class="card">
          <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Scoreboard</h2>
          <div class="scoreboard">
            <div class="player-card active">
              <div class="player-name">Player 1</div>
              <div class="player-score" id="total-score">0</div>
            </div>
          </div>
        </div>

        <div class="card" style="flex: 1;">
          <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Round Log</h2>
          <ul class="history-list" id="history-log">
            <!-- Log entries appear here -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    let availableNumbers = [];
    let currentTarget = null;
    let totalScore = 0;
    let roundCount = 0;

    function startNewGame() {
      // Initialize pool with numbers 1 through 20
      availableNumbers = Array.from({ length: 20 }, (_, i) => i + 1);
      totalScore = 0;
      roundCount = 0;
      
      document.getElementById('total-score').innerText = totalScore;
      document.getElementById('history-log').innerHTML = '';
      
      nextRound();
    }

    function nextRound() {
      if (availableNumbers.length === 0) {
        document.getElementById('target-display').innerText = "DONE";
        alert(`Game Over! Final Score: ${totalScore}`);
        return;
      }

      // Pick random index from available pool
      const randomIndex = Math.floor(Math.random() * availableNumbers.length);
      currentTarget = availableNumbers[randomIndex];

      // Remove selected number from pool
      availableNumbers.splice(randomIndex, 1);

      // Display selected target
      document.getElementById('target-display').innerText = currentTarget;
    }

    function handleInput(multiplier) {
      if (!currentTarget) {
        startNewGame();
        return;
      }

      const points = currentTarget * multiplier;
      totalScore += points;
      roundCount++;

      let label = "MISS";
      if (multiplier === 1) label = "SINGLE";
      if (multiplier === 2) label = "DOUBLE";
      if (multiplier === 3) label = "TRIPLE";

      logRound(`Round ${roundCount}: Target ${currentTarget} x ${label} = ${points} pts`);
      updateScore();
      nextRound();
    }

    function handleBull(value) {
      if (!currentTarget && availableNumbers.length === 0) return;

      totalScore += value;
      roundCount++;

      const label = value === 50 ? "INNER BULL" : "OUTER BULL";
      logRound(`Round ${roundCount}: ${label} = ${value} pts`);
      updateScore();
      nextRound();
    }

    function updateScore() {
      document.getElementById('total-score').innerText = totalScore;
    }

    function logRound(text) {
      const log = document.getElementById('history-log');
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerText = text;
      log.prepend(li);
    }

    // Initialize game automatically on load
    startNewGame();
  </script>
</body>
</html>
