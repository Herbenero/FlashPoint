<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Point - Dart Game Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #1d2129;
      --soft: #252a34;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f7fb;
      --muted: #a8b0c0;
      --accent: #ff5a36;
      --accent-2: #ffd166;
      --success: #67e8a5;
      --danger: #ff6b6b;
      --blue: #7cc6ff;
      --purple: #c084fc;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 22px;
      --radius-sm: 14px;
      --max: 1400px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: var(--max);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      padding: 20px 32px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .controls-top {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      background: var(--soft);
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      filter: none !important;
    }

    .btn-accent {
      background: var(--accent);
      color: #000;
    }

    .btn-submit {
      background: var(--success);
      color: #000;
      font-size: 1.1rem;
      padding: 16px 24px;
      width: 100%;
      margin-top: 16px;
    }

    .btn-undo {
      background: #3a3f4d;
      color: var(--accent-2);
      border: 1px solid rgba(255, 209, 102, 0.3);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    /* Setup Screen */
    .setup-card {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setup-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setup-group label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select, input[type="text"] {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
    }

    .player-inputs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    /* Target Display */
    .target-card {
      background: linear-gradient(135deg, var(--panel-2), var(--soft));
      text-align: center;
      padding: 24px;
      margin-bottom: 24px;
      border: 2px solid var(--accent);
    }

    .target-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .target-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5.5rem;
      color: var(--accent-2);
      line-height: 1;
    }

    .current-turn-indicator {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue);
      margin-top: 10px;
    }

    /* Turn Darts Tracker */
    .darts-turn-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .dart-slot {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      min-width: 90px;
      text-align: center;
    }

    .dart-slot.active {
      border-color: var(--accent-2);
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.2);
    }

    .dart-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .dart-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }

    /* Modifier Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .keypad.quad-enabled {
      grid-template-columns: repeat(4, 1fr);
    }

    .btn-mod {
      padding: 28px 12px;
      font-size: 1.1rem;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .btn-mod.single { border-color: var(--blue); color: var(--blue); }
    .btn-mod.double { border-color: var(--accent-2); color: var(--accent-2); }
    .btn-mod.triple { border-color: var(--accent); color: var(--accent); }
    .btn-mod.quad { border-color: var(--purple); color: var(--purple); }
    .btn-mod.miss { grid-column: span 3; color: var(--danger); background: var(--soft); }
    .keypad.quad-enabled .btn-mod.miss { grid-column: span 4; }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .player-card {
      background: var(--panel-2);
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      text-align: center;
      transition: all 0.2s ease;
    }

    .player-card.active {
      border-color: var(--accent);
      background: rgba(255, 90, 54, 0.1);
      box-shadow: 0 0 15px rgba(255, 90, 54, 0.2);
    }

    .player-name {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 4px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-size: 2rem;
      font-weight: 700;
    }

    /* History Feed */
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--panel-2);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>FLASH POINT</h1>
      <div class="controls-top">
        <button id="undo-btn" onclick="undoLastDart()" class="btn-undo" style="display: none;">↩ Undo Dart</button>
        <button onclick="showSetupScreen()" class="btn-accent">New Game</button>
      </div>
    </header>

    <!-- SETUP VIEW -->
    <div id="setup-view" class="card setup-card">
      <h2 style="font-size: 1.5rem; color: var(--accent);">Game Setup</h2>
      
      <div class="setup-group">
        <label for="board-type">Board Type</label>
        <select id="board-type">
          <option value="basic">Standard Board (Single, Double, Triple)</option>
          <option value="quad">Quad Board (Single, Double, Triple, Quad)</option>
        </select>
      </div>

      <div class="setup-group">
        <label for="player-count">Number of Players</label>
        <select id="player-count" onchange="renderPlayerNameInputs()">
          <option value="1">1 Player</option>
          <option value="2" selected>2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
          <option value="5">5 Players</option>
          <option value="6">6 Players</option>
          <option value="7">7 Players</option>
          <option value="8">8 Players</option>
        </select>
      </div>

      <div class="setup-group">
        <label>Player Names</label>
        <div id="player-inputs-container" class="player-inputs-list">
          <!-- Dynamically generated player inputs -->
        </div>
      </div>

      <button onclick="startNewGame()" class="btn-accent" style="margin-top: 12px; padding: 18px; font-size: 1.1rem;">Start Game (5 Rounds)</button>
    </div>

    <!-- MAIN GAME VIEW -->
    <div id="game-view" class="main-grid" style="display: none;">
      <!-- Left Column: Target & Input Controls -->
      <div class="card">
        <!-- Dynamic Target Display -->
        <div class="target-card card">
          <div class="target-title">Current Round Target</div>
          <div class="target-number" id="target-display">--</div>
          <div class="current-turn-indicator" id="turn-display">Player 1's Turn</div>

          <!-- Current Turn 3 Darts Tracker -->
          <div class="darts-turn-container">
            <div class="dart-slot" id="slot-1">
              <div class="dart-label">Dart 1</div>
              <div class="dart-val" id="val-1">-</div>
            </div>
            <div class="dart-slot" id="slot-2">
              <div class="dart-label">Dart 2</div>
              <div class="dart-val" id="val-2">-</div>
            </div>
            <div class="dart-slot" id="slot-3">
              <div class="dart-label">Dart 3</div>
              <div class="dart-val" id="val-3">-</div>
            </div>
          </div>
        </div>

        <!-- Modifier Controls -->
        <div class="keypad" id="keypad">
          <button class="btn-mod single" id="btn-single" onclick="handleInput(1)">SINGLE (1x)</button>
          <button class="btn-mod double" id="btn-double" onclick="handleInput(2)">DOUBLE (2x)</button>
          <button class="btn-mod triple" id="btn-triple" onclick="handleInput(3)">TRIPLE (3x)</button>
          <button class="btn-mod quad" id="quad-btn" style="display: none;" onclick="handleInput(4)">QUAD (4x)</button>
          <button class="btn-mod miss" id="btn-miss" onclick="handleInput(0)">MISS (0)</button>
        </div>

        <button id="submit-turn-btn" class="btn-submit" onclick="submitTurn()" disabled>Submit Turn</button>
      </div>

      <!-- Right Column: Scores & Log -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        <div class="card">
          <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Scoreboard</h2>
          <div class="scoreboard" id="scoreboard">
            <!-- Dynamic Player Scores -->
          </div>
        </div>

        <div class="card" style="flex: 1;">
          <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Game Log</h2>
          <ul class="history-list" id="history-log">
            <!-- Log entries appear here -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    let availableNumbers = [];
    let currentTarget = null;
    let players = [];
    let currentPlayerIndex = 0;
    let roundCount = 1;
    const MAX_ROUNDS = 5;
    const MAX_DARTS = 3;

    // Current turn state (3 darts for current player)
    let currentTurnDarts = [];

    // History stack for undo capability
    let historyStack = [];

    function renderPlayerNameInputs() {
      const count = parseInt(document.getElementById('player-count').value);
      const container = document.getElementById('player-inputs-container');
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `Player ${i} Name`;
        input.value = `Player ${i}`;
        input.id = `player-input-${i}`;
        container.appendChild(input);
      }
    }

    function showSetupScreen() {
      document.getElementById('setup-view').style.display = 'flex';
      document.getElementById('game-view').style.display = 'none';
      document.getElementById('undo-btn').style.display = 'none';
      renderPlayerNameInputs();
    }

    function startNewGame() {
      const count = parseInt(document.getElementById('player-count').value);
      players = [];

      for (let i = 1; i <= count; i++) {
        const nameVal = document.getElementById(`player-input-${i}`).value.trim();
        players.push({
          id: i,
          name: nameVal || `Player ${i}`,
          score: 0
        });
      }

      const boardType = document.getElementById('board-type').value;
      const quadBtn = document.getElementById('quad-btn');
      const keypad = document.getElementById('keypad');

      if (boardType === 'quad') {
        quadBtn.style.display = 'block';
        keypad.classList.add('quad-enabled');
      } else {
        quadBtn.style.display = 'none';
        keypad.classList.remove('quad-enabled');
      }

      availableNumbers = Array.from({ length: 20 }, (_, i) => i + 1);
      currentPlayerIndex = 0;
      roundCount = 1;
      currentTurnDarts = [];
      historyStack = [];

      document.getElementById('setup-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'grid';
      document.getElementById('undo-btn').style.display = 'inline-block';
      
      renderScoreboard();
      renderLog();
      nextRound();
    }

    function renderScoreboard() {
      const scoreboard = document.getElementById('scoreboard');
      scoreboard.innerHTML = '';

      players.forEach((player, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === currentPlayerIndex ? 'active' : ''}`;
        card.id = `player-card-${idx}`;
        card.innerHTML = `
          <div class="player-name">${player.name}</div>
          <div class="player-score" id="player-score-${idx}">${player.score}</div>
        `;
        scoreboard.appendChild(card);
      });
    }

    function nextRound() {
      if (roundCount > MAX_ROUNDS || availableNumbers.length === 0) {
        document.getElementById('target-display').innerText = "DONE";
        document.getElementById('turn-display').innerText = "Game Complete!";
        disableKeypad(true);
        document.getElementById('submit-turn-btn').disabled = true;
        announceWinner();
        return;
      }

      const randomIndex = Math.floor(Math.random() * availableNumbers.length);
      currentTarget = availableNumbers[randomIndex];
      availableNumbers.splice(randomIndex, 1);

      document.getElementById('target-display').innerText = currentTarget;
      updateTurnDisplay();
    }

    function updateTurnDisplay() {
      if (roundCount > MAX_ROUNDS) return;
      const activePlayer = players[currentPlayerIndex];
      document.getElementById('turn-display').innerText = `${activePlayer.name}'s Turn (Round ${roundCount} of ${MAX_ROUNDS})`;
      
      players.forEach((_, idx) => {
        const card = document.getElementById(`player-card-${idx}`);
        if (card) {
          if (idx === currentPlayerIndex) {
            card.classList.add('active');
          } else {
            card.classList.remove('active');
          }
        }
      });

      updateDartTrackerUI();
    }

    function updateDartTrackerUI() {
      for (let i = 1; i <= MAX_DARTS; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const val = document.getElementById(`val-${i}`);
        const dartData = currentTurnDarts[i - 1];

        if (dartData) {
          slot.classList.remove('active');
          val.innerText = `${dartData.label} (+${dartData.points})`;
        } else if (i === currentTurnDarts.length + 1 && currentTurnDarts.length < MAX_DARTS) {
          slot.classList.add('active');
          val.innerText = '-';
        } else {
          slot.classList.remove('active');
          val.innerText = '-';
        }
      }

      // Keypad enable/disable based on whether 3 darts entered
      disableKeypad(currentTurnDarts.length >= MAX_DARTS);

      // Submit button enabled ONLY when 3 darts entered
      document.getElementById('submit-turn-btn').disabled = currentTurnDarts.length < MAX_DARTS;
    }

    function disableKeypad(disabled) {
      document.getElementById('btn-single').disabled = disabled;
      document.getElementById('btn-double').disabled = disabled;
      document.getElementById('btn-triple').disabled = disabled;
      document.getElementById('quad-btn').disabled = disabled;
      document.getElementById('btn-miss').disabled = disabled;
    }

    function handleInput(multiplier) {
      if (roundCount > MAX_ROUNDS || currentTurnDarts.length >= MAX_DARTS) return;

      const points = currentTarget * multiplier;
      let label = "MISS";
      if (multiplier === 1) label = "1x";
      if (multiplier === 2) label = "2x";
      if (multiplier === 3) label = "3x";
      if (multiplier === 4) label = "4x";

      const dartEntry = {
        multiplier: multiplier,
        points: points,
        label: label
      };

      currentTurnDarts.push(dartEntry);
      updateDartTrackerUI();
    }

    function submitTurn() {
      if (currentTurnDarts.length < MAX_DARTS) return;

      const player = players[currentPlayerIndex];
      const turnPoints = currentTurnDarts.reduce((sum, d) => sum + d.points, 0);

      // Save complete turn state for full undo capability
      historyStack.push({
        playerIndex: currentPlayerIndex,
        roundCount: roundCount,
        currentTarget: currentTarget,
        availableNumbers: [...availableNumbers],
        turnDarts: [...currentTurnDarts],
        turnPoints: turnPoints
      });

      // Apply points to player
      player.score += turnPoints;
      updateScores();

      // Log turn details
      const dartSummary = currentTurnDarts.map(d => d.label).join(', ');
      logRound(`${player.name} - R${roundCount} [T:${currentTarget}]: [${dartSummary}] (+${turnPoints} pts)`);

      // Reset turn darts for next turn
      currentTurnDarts = [];

      // Advance Player / Round
      currentPlayerIndex++;
      if (currentPlayerIndex >= players.length) {
        currentPlayerIndex = 0;
        roundCount++;
        nextRound();
      } else {
        updateTurnDisplay();
      }
    }

    function undoLastDart() {
      // First try undoing an unsubmitted dart in the current turn
      if (currentTurnDarts.length > 0) {
        currentTurnDarts.pop();
        updateDartTrackerUI();
        return;
      }

      // If current turn is empty, undo previous player's submitted turn
      if (historyStack.length === 0) {
        alert("No darts or turns to undo!");
        return;
      }

      const lastState = historyStack.pop();

      // If a new round was triggered, put the new target back
      if (currentTarget !== null && currentTarget !== lastState.currentTarget) {
        availableNumbers.push(currentTarget);
      }

      // Restore game state
      currentPlayerIndex = lastState.playerIndex;
      roundCount = lastState.roundCount;
      currentTarget = lastState.currentTarget;
      availableNumbers = lastState.availableNumbers;
      currentTurnDarts = lastState.turnDarts;

      // Revert player score
      players[currentPlayerIndex].score -= lastState.turnPoints;

      // Re-render UI
      document.getElementById('target-display').innerText = currentTarget;
      updateTurnDisplay();
      updateScores();

      // Remove last log entry
      const log = document.getElementById('history-log');
      if (log.firstChild) {
        log.removeChild(log.firstChild);
      }
    }

    function updateScores() {
      players.forEach((player, idx) => {
        const scoreElem = document.getElementById(`player-score-${idx}`);
        if (scoreElem) scoreElem.innerText = player.score;
      });
    }

    function logRound(text) {
      const log = document.getElementById('history-log');
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerText = text;
      log.prepend(li);
    }

    function renderLog() {
      document.getElementById('history-log').innerHTML = '';
    }

    function announceWinner() {
      let maxScore = -1;
      let winners = [];

      players.forEach(p => {
        if (p.score > maxScore) {
          maxScore = p.score;
          winners = [p.name];
        } else if (p.score === maxScore) {
          winners.push(p.name);
        }
      });

      const resultText = winners.length > 1 
        ? `It's a tie between ${winners.join(' & ')} with ${maxScore} pts!`
        : `${winners[0]} wins with ${maxScore} pts!`;

      alert(`Game Over after 5 Rounds!\n${resultText}`);
    }

    // Show setup screen on load
    showSetupScreen();
  </script>
</body>
</html>
